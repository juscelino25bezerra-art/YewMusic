name: YewMusic CI

# YEWMUSIC: build de verificação de cada fase. Roda em todo push para yewmusic/** e em PRs para
# main: confere a tradução pt-BR, compila o APK de debug, roda os testes unitários e guarda o APK
# como artefato do workflow (Actions -> esta execução -> Artifacts) para instalar no celular.
# O CI.yml herdado do SmartTube compila o flavor stbeta, que não existe mais.

on:
  push:
    branches: ["yewmusic/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yewmusic-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Check the pt-BR translation
        run: python3 tools/i18n/check_ptbr.py

      - name: Tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Build the debug APK
        run: ./gradlew --stacktrace :smarttubetv:assembleStmobileDebug

      - name: Unit tests
        run: ./gradlew --stacktrace --continue :smarttubetv:testStmobileDebugUnitTest :common:testDebugUnitTest

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: YewMusic-debug-${{ github.sha }}
          path: smarttubetv/build/outputs/renamed_apks/stmobileDebug/*.apk
          if-no-files-found: error
          retention-days: 14
